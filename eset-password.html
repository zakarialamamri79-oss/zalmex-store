<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZALMEX | تغيير كلمة السر</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    .box {
      max-width: 420px;
      margin: 50px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #171717;
      color: white;
      font-weight: bold;
    }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>ZALMEX</h2>
    <h3>تغيير كلمة السر</h3>
    <p>أدخل كلمة السر الجديدة مرتين.</p>

    <form id="resetForm">
      <input id="password" type="password"
        placeholder="كلمة السر الجديدة" minlength="8" required>
      <input id="confirmPassword" type="password"
        placeholder="تأكيد كلمة السر" minlength="8" required>
      <button type="submit">حفظ كلمة السر</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://jblehthxfyeseqbzhijy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_6JRg31NgFFiry4ah_qxBvw_9ffoph9s";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");

    document.getElementById("resetForm").addEventListener(
      "submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          message.textContent = "كلمتا السر غير متطابقتين.";
          return;
        }

        message.textContent = "جاري تغيير كلمة السر...";

        const { error } = await db.auth.updateUser({ password });

        if (error) {
          message.textContent =
            "فشل تغيير كلمة السر: " + error.message;
          return;
        }

        message.textContent =
          "تم تغيير كلمة السر. يمكنك الآن العودة إلى لوحة الإدارة.";
      }
    );
  </script>
</body>
</html>
